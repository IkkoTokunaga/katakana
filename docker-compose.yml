services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: katakana-web
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - katakana_node_modules:/app/node_modules
      - katakana_next:/app/.next
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install && npm run dev"
    stdin_open: true
    tty: true

volumes:
  katakana_node_modules:
  katakana_next:
